<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Quiz Interactif</h1>
    <p>Appuyez sur le bouton pour commencer le quiz.</p>
    <button onclick="lancerQuiz()">Commencer</button>
    <h2 id="R" ></div>
    <script>
        // 1. Tableau de questions
        const QUESTIONS = [
          ["Quelle est la capitale de la France ?", "Paris"],
          ["Combien font 2 + 2 ?", "4"],
          ["Quelle est la couleur du ciel ?", "Bleu"],
          ["Quelle est la capitale du Maroc ?", "Rabat"],
          ["Combien de jours dans une semaine ?", "7"]
        ];
    
        function lancerQuiz() {
          let bonnesReponses = 0;
    
          for (let i = 0; i < QUESTIONS.length; i++) {
            const question = QUESTIONS[i][0];
            const reponseCorrecte = QUESTIONS[i][1];
            const reponseUtilisateur = prompt(question);
    
            if (reponseUtilisateur !== null && reponseUtilisateur.trim().toLowerCase() === reponseCorrecte.toLowerCase()) {
              alert("Réponse juste !");
              bonnesReponses++;
            } else {
              alert("Réponse fausse !");
            }
          }
    
          document.getElementById("resultat").innerHTML =
            `Vous avez répondu correctement à ${bonnesReponses} question(s) sur ${QUESTIONS.length}.`;
        }
      </script>
    
</body>
</html>
